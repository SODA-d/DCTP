  #   parallel_backend: 'balanced_dask'

  #   override_config:
  #     preprocessing:
  #       use_static_cost: False
  #       use_dynamic_cost: False

  No reward structure:
    name: DCTP
    num_process: 16
    parallel_backend: 'balanced_dask'


results_views:
  TabularResults:
    type: tabular
    drop_keys: [ seed ]
    print_results: True

  Ablations:
    type: plot
    x: num_agents
    y: avg_throughput
    use_log_scale_x: False
    use_log_scale_y: False
    width: 2.5
    height: 2.5
    line_width: 2
    legend_font_size: 6
    font_size: 8
    hue_order: [DCTP,No static and dynamic cost,No congestion-aware]
    ticks: [ 32, 64, 96, 128, 160, 192 ]
    name: Warehouse $46 \times 33$ 


  Ablations2:
    type: plot
    x: num_agents
    y: ISR10
    use_log_scale_x: False
    use_log_scale_y: False
    width: 2.5
    height: 2.5
    line_width: 2
    legend_font_size: 6
    font_size: 8
    hue_order: [DCTP,No static and dynamic cost,No congestion-aware]
    ticks: [ 32, 64, 96, 128, 160, 192 ]
    name: Warehouse $46 \times 33$ 

